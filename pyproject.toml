[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-cod"
version = "0.1.0"
description = "Counterfactual background reconstruction experiments for realistic camouflaged object detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0", "opencv-python-headless>=4.8", "onnxruntime>=1.20"]

[project.optional-dependencies]
model = ["torch>=2.6", "torchvision>=0.20", "openpyxl>=3.1"]
metrics = ["pysodmetrics==1.6.2"]

[project.scripts]
cod-recon = "cod_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
